name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (validate without publishing)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  gate:
    name: Pre-publish gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  publish:
    name: Publish crates
    needs: gate
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish workspace crates in dependency order
        run: |
          set -euo pipefail

          CRATES=(
            tenui-core
            tenui-anim
            tenui-chaos
            tenui-collab
            tenui-layout
            tenui-compositor
            tenui-dnd
            tenui-reactive
            tenui-ext
            tenui-hid
            tenui-macros
            tenui-math
            tenui-media
            tenui-simd
            tenui-runtime
            tenui-session
            tenui-sound
            tenui-text
            tenui-std
            tenui-vfx
            tenui-virt
            tenui-wgpu
            tenui
          )

          for crate in "${CRATES[@]}"; do
            echo "::group::Publishing $crate"
            cargo publish -p "$crate" --no-verify
            echo "::endgroup::"
            # crates.io index needs time to propagate before dependents can resolve
            sleep 30
          done

  dry-run:
    name: Dry run (validate packaging)
    needs: gate
    runs-on: ubuntu-latest
    if: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate packaging for all crates
        run: |
          set -euo pipefail

          CRATES=(
            tenui-core
            tenui-anim
            tenui-chaos
            tenui-collab
            tenui-layout
            tenui-compositor
            tenui-dnd
            tenui-reactive
            tenui-ext
            tenui-hid
            tenui-macros
            tenui-math
            tenui-media
            tenui-simd
            tenui-runtime
            tenui-session
            tenui-sound
            tenui-text
            tenui-std
            tenui-vfx
            tenui-virt
            tenui-wgpu
            tenui
          )

          for crate in "${CRATES[@]}"; do
            echo "::group::Packaging $crate"
            cargo package -p "$crate" --no-verify --allow-dirty
            echo "::endgroup::"
          done

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Tenui ${{ steps.version.outputs.version }}"
          generate_release_notes: true
