name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (validate without publishing)"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  gate:
    name: Pre-publish gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  publish:
    name: Publish crates
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    if: ${{ !inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish workspace crates in dependency order
        run: |
          set -euo pipefail

          # crates.io rate limits (leaky bucket):
          #   New crates:   burst 5,  then 1 per 10 min
          #   New versions: burst 30, then 1 per 1 min

          CRATES=(
            tenui-core
            tenui-anim
            tenui-chaos
            tenui-collab
            tenui-layout
            tenui-compositor
            tenui-dnd
            tenui-reactive
            tenui-ext
            tenui-hid
            tenui-macros
            tenui-math
            tenui-media
            tenui-simd
            tenui-runtime
            tenui-session
            tenui-sound
            tenui-text
            tenui-std
            tenui-vfx
            tenui-virt
            tenui-wgpu
            tenui
          )

          NEW_CRATE_BURST=5
          NEW_CRATE_INTERVAL=610   # 10 min + 10s buffer
          NEW_VERSION_BURST=30
          NEW_VERSION_INTERVAL=65  # 1 min + 5s buffer
          new_crate_count=0
          new_version_count=0

          get_crate_version() {
            local crate="$1"
            cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version'
          }

          crate_status() {
            local crate="$1"
            local local_version
            local_version=$(get_crate_version "$crate")
            local search_result
            search_result=$(cargo search --limit 1 "$crate" 2>/dev/null)

            if echo "$search_result" | grep -q "^${crate} = "; then
              local published_version
              published_version=$(echo "$search_result" | grep "^${crate} = " | sed 's/.*"\(.*\)".*/\1/')
              if [ "$published_version" = "$local_version" ]; then
                echo "published"
              else
                echo "update"
              fi
            else
              echo "new"
            fi
          }

          wait_for_rate_limit() {
            local crate="$1"
            local is_new="$2"

            if [ "$is_new" = "true" ]; then
              new_crate_count=$((new_crate_count + 1))
              if [ "$new_crate_count" -gt "$NEW_CRATE_BURST" ]; then
                echo "  Rate limit: new crate #$new_crate_count (past burst of $NEW_CRATE_BURST), waiting ${NEW_CRATE_INTERVAL}s..."
                sleep "$NEW_CRATE_INTERVAL"
              fi
            else
              new_version_count=$((new_version_count + 1))
              if [ "$new_version_count" -gt "$NEW_VERSION_BURST" ]; then
                echo "  Rate limit: new version #$new_version_count (past burst of $NEW_VERSION_BURST), waiting ${NEW_VERSION_INTERVAL}s..."
                sleep "$NEW_VERSION_INTERVAL"
              fi
            fi
          }

          publish_crate() {
            local crate="$1"
            local max_attempts=5

            for attempt in $(seq 1 $max_attempts); do
              local output
              if output=$(cargo publish -p "$crate" --no-verify 2>&1); then
                echo "$output"
                return 0
              fi

              echo "$output"

              # Already published (index hadn't caught up when we checked)
              if echo "$output" | grep -qi "already uploaded"; then
                echo "  Already published (detected during upload), skipping"
                return 0
              fi

              # Parse "try again after" from rate limit errors and sleep that long
              if echo "$output" | grep -qi "try again after\|rate limit"; then
                local retry_after
                retry_after=$(echo "$output" | grep -oP '(?i)try again after[^0-9]*\K[0-9]+[hms0-9 ]*' | head -1)
                if [ -n "$retry_after" ]; then
                  # Parse seconds from crates.io retry message
                  local wait_secs
                  wait_secs=$(echo "$retry_after" | grep -oP '[0-9]+' | head -1)
                  wait_secs=$((wait_secs + 30))  # buffer
                  echo "  Rate limited. Retrying in ${wait_secs}s (attempt $attempt/$max_attempts)..."
                  sleep "$wait_secs"
                  continue
                fi
              fi

              # Index propagation or transient failure
              if [ "$attempt" -lt "$max_attempts" ]; then
                local wait=$((attempt * 30 + 10))
                echo "  Attempt $attempt failed, retrying in ${wait}s..."
                sleep "$wait"
              fi
            done
            echo "::error::Failed to publish $crate after $max_attempts attempts"
            return 1
          }

          for crate in "${CRATES[@]}"; do
            echo "::group::Publishing $crate"

            status=$(crate_status "$crate")

            if [ "$status" = "published" ]; then
              echo "  Already published at current version, skipping"
              echo "::endgroup::"
              continue
            fi

            is_new="false"
            if [ "$status" = "new" ]; then
              is_new="true"
              echo "  New crate (not yet on crates.io)"
            else
              echo "  Existing crate (publishing new version)"
            fi

            wait_for_rate_limit "$crate" "$is_new"
            publish_crate "$crate"

            # Always pause between publishes for index propagation
            echo "  Waiting 20s for index propagation..."
            sleep 20

            echo "::endgroup::"
          done

  dry-run:
    name: Dry run (validate packaging)
    needs: gate
    runs-on: ubuntu-latest
    if: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate packaging for all crates
        run: |
          set -euo pipefail

          CRATES=(
            tenui-core
            tenui-anim
            tenui-chaos
            tenui-collab
            tenui-layout
            tenui-compositor
            tenui-dnd
            tenui-reactive
            tenui-ext
            tenui-hid
            tenui-macros
            tenui-math
            tenui-media
            tenui-simd
            tenui-runtime
            tenui-session
            tenui-sound
            tenui-text
            tenui-std
            tenui-vfx
            tenui-virt
            tenui-wgpu
            tenui
          )

          for crate in "${CRATES[@]}"; do
            echo "::group::Packaging $crate"
            cargo package -p "$crate" --no-verify --allow-dirty
            echo "::endgroup::"
          done

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Tenui ${{ steps.version.outputs.version }}"
          generate_release_notes: true
