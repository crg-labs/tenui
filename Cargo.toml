[workspace]
resolver = "3"
members = [
    "crates/tenui-core",
    "crates/tenui-layout",
    "crates/tenui-reactive",
    "crates/tenui-compositor",
    "crates/tenui-anim",
    "crates/tenui-std",
    "crates/tenui-vfx",
    "crates/tenui-ext",
    "crates/tenui-macros",
    "crates/tenui-dnd",
    "crates/tenui-virt",
    "crates/tenui-text",
    "crates/tenui-session",
    "crates/tenui-sound",
    "crates/tenui-wgpu",
    "crates/tenui-simd",
    "crates/tenui-collab",
    "crates/tenui-media",
    "crates/tenui-math",
    "crates/tenui-hid",
    "crates/tenui-chaos",
    "crates/tenui-runtime",
    "crates/tenui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Tenui Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/crg-labs/tenui"

[workspace.dependencies]
bitflags = "2.13"
unicode-width = "0.2"
# Logging facade only — no subscriber/backend. TUI apps attach their own sink
tracing = "0.1"
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }
taffy = "0.14"
signal-hook = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "macros"] }
criterion = { version = "0.8", default-features = false }

# Internal workspace crates
tenui-core = { path = "crates/tenui-core", version = "0.1.0" }
tenui-layout = { path = "crates/tenui-layout", version = "0.1.0" }
tenui-reactive = { path = "crates/tenui-reactive", version = "0.1.0" }
tenui-compositor = { path = "crates/tenui-compositor", version = "0.1.0" }
tenui-anim = { path = "crates/tenui-anim", version = "0.1.0" }
tenui-std = { path = "crates/tenui-std", version = "0.1.0" }
tenui-vfx = { path = "crates/tenui-vfx", version = "0.1.0" }
tenui-ext = { path = "crates/tenui-ext", version = "0.1.0" }
tenui-macros = { path = "crates/tenui-macros", version = "0.1.0" }
tenui-dnd = { path = "crates/tenui-dnd", version = "0.1.0" }
tenui-virt = { path = "crates/tenui-virt", version = "0.1.0" }
tenui-text = { path = "crates/tenui-text", version = "0.1.0" }
tenui-session = { path = "crates/tenui-session", version = "0.1.0" }
tenui-sound = { path = "crates/tenui-sound", version = "0.1.0" }
tenui-wgpu = { path = "crates/tenui-wgpu", version = "0.1.0" }
tenui-simd = { path = "crates/tenui-simd", version = "0.1.0" }
tenui-collab = { path = "crates/tenui-collab", version = "0.1.0" }
tenui-media = { path = "crates/tenui-media", version = "0.1.0" }
tenui-math = { path = "crates/tenui-math", version = "0.1.0" }
tenui-hid = { path = "crates/tenui-hid", version = "0.1.0" }
tenui-chaos = { path = "crates/tenui-chaos", version = "0.1.0" }
tenui-runtime = { path = "crates/tenui-runtime", version = "0.1.0" }
tenui = { path = "crates/tenui", version = "0.1.0" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"
panic = "abort"